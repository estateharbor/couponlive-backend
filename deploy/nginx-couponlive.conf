# CouponLive nginx — coexists with the other sites on this server.
# Apply with:
#   cp deploy/nginx-couponlive.conf /etc/nginx/sites-available/couponlive.conf
#   nginx -t && systemctl reload nginx
# certbot manages the SSL cert lines; these server_names/paths match this host.

# ── Static frontend (Next.js export), served directly by nginx ──────────────
server {
    server_name couponlive.in;
    server_tokens off; # don't leak the nginx version in headers / error pages

    root /opt/couponlive/backend/web;
    index index.html;

    # Security headers (credibility + hygiene; safe for a static site).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Clickjacking protection. frame-ancestors is the modern control; X-Frame-Options
    # covers older browsers. Only this one CSP directive is set, so it does NOT
    # restrict the site's inline styles/scripts (no default-src).
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Canonical trailing slash: 301 an extensionless page path to its /slash/
    # form (e.g. /deals -> /deals/) so both URLs don't index as duplicates.
    # Skips anything with a dot (files: .html/.js/.xml/.png) and the bare root.
    rewrite ^([^.]*[^/])$ $1/ permanent;

    location / {
        # Real 404 (=404, not a soft 200) so missing pages aren't indexed.
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hashed build assets can be cached hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/couponlive.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/couponlive.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── www -> non-www (canonical host) ─────────────────────────────────────────
server {
    server_name www.couponlive.in;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/couponlive.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/couponlive.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://couponlive.in$request_uri;
}

# ── API — reverse-proxied to the CouponLive container (localhost:8010) ───────
server {
    server_name api.couponlive.in;
    server_tokens off; # don't leak the nginx version

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/couponlive.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/couponlive.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTP -> HTTPS (managed by Certbot) ──────────────────────────────────────
server {
    if ($host = www.couponlive.in) { return 301 https://couponlive.in$request_uri; }
    if ($host = couponlive.in) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name couponlive.in www.couponlive.in;
    return 404; # managed by Certbot
}
server {
    if ($host = api.couponlive.in) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name api.couponlive.in;
    return 404; # managed by Certbot
}
