# CouponLive — coexists with the other nginx sites on this server.
# certbot --nginx adds the :443 blocks + HTTP->HTTPS redirect automatically.

# Static frontend (Next.js export), served directly by nginx.
server {
    listen 80;
    listen [::]:80;
    server_name couponlive.in www.couponlive.in;

    root /opt/couponlive/backend/web;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # Hashed build assets can be cached hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# API — reverse-proxied to the CouponLive container (localhost:8010).
server {
    listen 80;
    listen [::]:80;
    server_name api.couponlive.in;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
